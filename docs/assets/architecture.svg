<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620"
     font-family="'Helvetica Neue','Arial','SimHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#243447"/>
    </marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6B7C"/>
    </marker>
    <marker id="ad-start" viewBox="0 0 10 10" refX="0.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#5B6B7C"/>
    </marker>
    <style>
      .grp    { font-size: 11.5px; font-style: italic; fill: #5B6B7C; }
      .box    { fill: #FFFFFF; stroke: #243447; stroke-width: 1.1; }
      .boxd   { fill: #F4F7FA; stroke: #243447; stroke-width: 1.1; }
      .name   { font-size: 12.5px; font-weight: bold; fill: #16283C; text-anchor: middle; }
      .sub    { font-size: 10.5px; fill: #5B6B7C; text-anchor: middle; }
      .mono   { font-size: 10.5px; font-family: Consolas, monospace; fill: #5B6B7C; }
      .flow   { stroke: #243447; stroke-width: 1.1; fill: none; marker-end: url(#a); }
      .dash   { stroke: #5B6B7C; stroke-width: 1; fill: none; stroke-dasharray: 4 3;
                marker-end: url(#ad); marker-start: url(#ad-start); }
      .frame  { fill: none; stroke: #9CB3C7; stroke-width: 1; stroke-dasharray: 6 4; }
      .cap    { font-size: 10px; fill: #5B6B7C; }
    </style>
  </defs>

  <rect width="1240" height="620" fill="#FFFFFF"/>

  <!-- 输入 -->
  <text class="grp" x="40" y="32">输入素材（只读）</text>
  <g>
    <rect class="box" x="40"  y="44" width="150" height="40" rx="3"/>
    <text class="name" x="115" y="69">PPTX</text>
    <rect class="box" x="204" y="44" width="150" height="40" rx="3"/>
    <text class="name" x="279" y="69">PDF</text>
    <rect class="box" x="368" y="44" width="150" height="40" rx="3"/>
    <text class="name" x="443" y="69">DOCX</text>
    <rect class="box" x="532" y="44" width="150" height="40" rx="3"/>
    <text class="name" x="607" y="69">TXT / MD</text>
    <rect class="box" x="696" y="44" width="150" height="40" rx="3"/>
    <text class="name" x="771" y="69">课堂录音</text>
    <rect class="box" x="860" y="44" width="150" height="40" rx="3"/>
    <text class="name" x="935" y="69">学生手记</text>
  </g>

  <path class="flow" d="M525 84 L525 114"/>

  <!-- IR -->
  <rect class="boxd" x="345" y="114" width="360" height="66" rx="3"/>
  <text class="name" x="525" y="140">中间表示 IR</text>
  <text class="sub" x="525" y="160">每块带定位符 · 按内容哈希缓存 · 逐块可溯源</text>

  <path class="flow" d="M525 180 L525 206"/>

  <!-- 确定性层 -->
  <rect class="frame" x="40" y="208" width="1000" height="172" rx="4"/>
  <text class="grp" x="56" y="230">确定性层 · 离线 · 不调用模型</text>

  <g>
    <rect class="box" x="64"  y="256" width="124" height="64" rx="3"/>
    <text class="name" x="126" y="282">ingest</text>
    <text class="sub"  x="126" y="301">解析为块</text>

    <rect class="box" x="202" y="256" width="124" height="64" rx="3"/>
    <text class="name" x="264" y="282">probe</text>
    <text class="sub"  x="264" y="301">能力探测</text>

    <rect class="box" x="340" y="256" width="124" height="64" rx="3"/>
    <text class="name" x="402" y="282">align</text>
    <text class="sub"  x="402" y="301">录音 ↔ 页</text>

    <rect class="box" x="478" y="256" width="124" height="64" rx="3"/>
    <text class="name" x="540" y="282">units</text>
    <text class="sub"  x="540" y="301">切分知识点</text>

    <rect class="box" x="616" y="256" width="124" height="64" rx="3"/>
    <text class="name" x="678" y="282">outline</text>
    <text class="sub"  x="678" y="301">骨架与编号</text>

    <rect class="box" x="754" y="256" width="124" height="64" rx="3"/>
    <text class="name" x="816" y="282">render</text>
    <text class="sub"  x="816" y="301">装配文档</text>

    <rect class="box" x="892" y="256" width="124" height="64" rx="3"/>
    <text class="name" x="954" y="282">gates</text>
    <text class="sub"  x="954" y="301">结构校验</text>
  </g>

  <path class="flow" d="M188 288 L202 288"/>
  <path class="flow" d="M326 288 L340 288"/>
  <path class="flow" d="M464 288 L478 288"/>
  <path class="flow" d="M602 288 L616 288"/>
  <path class="flow" d="M740 288 L754 288"/>
  <path class="flow" d="M878 288 L892 288"/>

  <!-- 输出 -->
  <text class="grp" x="1060" y="230">产物</text>
  <g>
    <rect class="box" x="1060" y="244" width="140" height="32" rx="3"/>
    <text class="name" x="1130" y="265">markdown</text>
    <rect class="box" x="1060" y="284" width="140" height="32" rx="3"/>
    <text class="name" x="1130" y="305">PDF</text>
    <rect class="box" x="1060" y="324" width="140" height="32" rx="3"/>
    <text class="name" x="1130" y="345">LaTeX</text>
    <rect class="box" x="1060" y="364" width="140" height="32" rx="3"/>
    <text class="name" x="1130" y="385">DOCX</text>
    <rect class="box" x="1060" y="404" width="140" height="32" rx="3"/>
    <text class="name" x="1130" y="425">PPTX</text>
    <rect class="box" x="1060" y="444" width="140" height="32" rx="3"/>
    <text class="name" x="1130" y="465">TXT</text>
  </g>

  <path class="flow" d="M1016 288 L1028 288"/>
  <path d="M1028 260 L1028 460" stroke="#243447" stroke-width="1.1" fill="none"/>
  <path class="flow" d="M1028 260 L1060 260"/>
  <path class="flow" d="M1028 300 L1060 300"/>
  <path class="flow" d="M1028 340 L1060 340"/>
  <path class="flow" d="M1028 380 L1060 380"/>
  <path class="flow" d="M1028 420 L1060 420"/>
  <path class="flow" d="M1028 460 L1060 460"/>

  <!-- 语义层 -->
  <path class="dash" d="M525 380 L525 404"/>
  <text class="cap" x="536" y="396">缺口 / 答案</text>

  <rect class="frame" x="40" y="404" width="966" height="150" rx="4"/>
  <text class="grp" x="56" y="426">语义层 · 结果一律落盘（可由人工填、脚本填、或服务层自动填）</text>

  <g>
    <rect class="box" x="80"  y="448" width="280" height="64" rx="3"/>
    <text class="name" x="220" y="474">compose</text>
    <text class="sub"  x="220" y="493">草稿 → 可读正文</text>

    <rect class="box" x="400" y="448" width="280" height="64" rx="3"/>
    <text class="name" x="540" y="474">review</text>
    <text class="sub"  x="540" y="493">证据支撑 / 对抗审查</text>

    <rect class="box" x="720" y="448" width="280" height="64" rx="3"/>
    <text class="name" x="860" y="474">remediate</text>
    <text class="sub"  x="860" y="493">按需补丁 · 可删除</text>
  </g>

  <text class="mono" x="80" y="540">.study/gaps/&lt;id&gt;.json</text>
  <path class="flow" d="M262 540 L300 540"/>
  <text class="mono" x="308" y="540">.study/gaps/answers/&lt;id&gt;.json</text>
  <text class="cap" x="56" y="576">服务层：study serve → 网页选素材与输出格式 · 对话提要求 · 自动调用模型填缺口 · 渲染成品</text>
  <text class="cap" x="640" y="540">`study` 命令行从不调用模型；服务层（study serve）代为填答，产物等价。</text>
</svg>
